[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instant-memori"
version = "0.1.0"
description = "A MongoDB-first personal memory pipeline with semantic and graph retrieval."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "groq>=0.37.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-experimental>=0.4.2",
    "langchain-google-genai>=4.3.3",
    "langchain-groq>=1.1.3",
    "langchain-neo4j>=0.10.0",
    "langchain-openai>=1.4.3",
    "langchain-pinecone>=0.2.13",
    "langgraph>=1.2.10",
    "llmgraphtransformer>=0.0.2",
    "neo4j>=6.2.0",
    "openai>=2.53.0",
    "pinecone>=7.3.0",
    "pydantic>=2.13.4",
    "pymongo[srv]>=4.17.0",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["memori*"]
